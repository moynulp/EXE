name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        shell: bash
        run: chmod +x gradlew || true

      - name: Build with Gradle
        run: ./gradlew build --no-daemon
        continue-on-error: true

      - name: Package Windows EXE (jpackage)
        run: ./gradlew packageMsi --no-daemon
        continue-on-error: true

      - name: Package Windows EXE (alternative)
        run: ./gradlew packageExe --no-daemon
        continue-on-error: true

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipVault-1.0.0-Windows-unsigned
          path: |
            build/compose/binaries/main/exe/**
            build/compose/binaries/main/msi/**
            build/outputs/**
          if-no-files-found: warn
          retention-days: 30
